name: sofa
# Sofascore tennis poller for Prism's sweat feed: a real browser session
# (Sofascore refuses server fetches) that pushes the live tennis list into
# Prism every few seconds. Same shape as ping.yml: one run loops ~5h50m and
# hands off to the next; the schedule is the fallback if a chain breaks.
on:
  schedule:
    - cron: "15 */3 * * *"
  workflow_dispatch:
    inputs:
      probe:
        description: "1 = one request, print status, exit"
        required: false
        default: "0"
concurrency:
  group: sofa
  cancel-in-progress: false
permissions:
  actions: write
  contents: read
jobs:
  sofa:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: browser
        run: |
          npm init -y >/dev/null
          npm i --no-audit --no-fund playwright@1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: poll
        env:
          PRISM_URL: https://prismbet.app
          TENNIS_INGEST_KEY: ${{ secrets.TENNIS_INGEST_KEY }}
          DURATION_S: "21000"
          PROBE: ${{ github.event.inputs.probe || '0' }}
        run: node scripts/sofa-poller.mjs
      - name: hand off to the next run
        if: always() && github.event.inputs.probe != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run sofa.yml --ref main -R "$GITHUB_REPOSITORY" || true
